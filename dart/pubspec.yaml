name: apiverve_bible
description: "Bible retrieves scripture passages and verses across nine public-domain translations, including the modern Berean Standard Bible (BSB), KJV, ASV, YLT and Darby. Supply a book, chapter, and optional verse number to get the text with testament classification, word count, and chapter totals."
version: 1.2.3
homepage: https://apiverve.com/marketplace/bible?utm_source=dart&utm_medium=referral&utm_content=homepage
repository: https://github.com/apiverve/bible-api/tree/main/dart

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  http: ^1.1.0
  http_parser: ^4.0.0

dev_dependencies:
  lints: ^3.0.0
  test: ^1.24.0
